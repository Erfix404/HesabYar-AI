- id: validate_rule_cf002_fail
  tool: validate_rule
  args:
    rule_id: CF002
    statements:
      cash_flow:
        beginning_cash: 400
        net_change_in_cash: 100
        effect_of_exchange_rate: 0
        ending_cash: 499
  expect:
    rule_id: CF002
    outcome: fail
    severity: error
    message: مانده پایان مطابقت ندارد
    actual: '1'
    explanation: 'فرمول: (beginning_cash + net_change_in_cash + effect_of_exchange_rate) - ending_cash = 1 — باید برابر 0
      (با تحمل 0.01) باشد. مقدار به‌دست‌آمده 1 است. مرجع: استاندارد 2'
    refs:
    - '2'
