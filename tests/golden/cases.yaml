      \ 3:** واحد تجاری هنگام بکارگیری این استاندارد، باید مفاد قرارداد و تمام واقعیتها و شرایط مربوط را مد نظر قرار دهد.\
      \ واحد تجاری باید این استاندارد، شامل استفاده از هرگونه اقتضای عملی، را بطور یکنواخت برای قراردادهای دارای ویژگیهای\
      \ مشابه و در شرایط مشابه بکار گیرد.\n- **بند 4:** این استاندارد، نحوه حسابداری یک قرارداد منفرد با مشتری را تعیین می‌کند.\
      \ با وجود این، به عنوان یک اقتضای عملی، واحد تجاری در صورتی‌که بطور معقول انتظار داشته باشد آثار ناشی از بکارگیری این\
