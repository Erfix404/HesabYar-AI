      \nتاریخ اجرا 131-132\n\nمطابقت با استانداردهای بین‌المللی گزارشگری مالی 133\n\nپیوستها\n\nپیوست الف\n\nپیوست ب\n\nپیوست\
      \ پ\n\nهدف\n\n1 . هدف این استاندارد تعیین اصولی است که واحد تجاری برای گزارش اطلاعات مفید به استفاده‌کنندگان صورتهای\
      \ مالی درباره ماهیت، مبلغ، زمانبندی و عدم اطمینان درآمد عملیاتی و جریانهای نقدی حاصل از قرارداد با یک مشتری، باید بکار\
      \ گیرد.\n\nدستیابی به هدف\n\n2 . برای دستیابی به هدف بند 1، اصل محوری این استاندارد آن است که واحد تجاری باید درآمد\
      \ عملیاتی را به‌گونه‌ای شناسایی کند که بیانگر انتقال کالاها یا خدمات تعهدشده به مشتریان به مبلغ مابه‌ازایی باشد که واحد\
      \ تجاری انتظار دارد در قبال آن کالاها یا خدمات، نسبت به آن محق باشد.\n\n3 . واحد تجاری هنگام بکارگیری این استاندارد،\
      \ باید مفاد قرارداد و تمام واقعیتها و شرایط مربوط را مد نظر قرار دهد. واحد تجاری باید این استاندارد، شامل استفاده از\
      \ هرگونه اقتضای عملی، را بطور یکنواخت برای قراردادهای دارای ویژگیهای مشابه و در شرایط مشابه بکار گیرد.\n\n4 . این استاندارد،\
      \ نحوه حسابداری یک قرارداد منفرد با مشتری را تعیین می‌کند. با وجود این، به عنوان یک اقتضای عملی، واحد تجاری در صورتی‌که\
      \ بطور معقول انتظار داشته باشد آثار ناشی از بکارگیری این استاندارد برای مجموعه‌ای از قراردادهای (یا تعهدات عملکردی)\
      \ دارای ویژگیهای مشابه بر صورتهای مالی، با آثار ناشی از بکارگیری این استاندارد برای هر یک از قراردادهای (یا تعهدات عملکردی)\
      \ موجود در مجموعه مذکور تفاوت بااهمیتی نداشته باشد، می‌تواند این استاندارد را برای آن مجموعه بکار گیرد. واحد تجاری هنگام\
      \ انجام حسابداری یک مجموعه قرارداد، باید از برآوردها و مفروضاتی استفاده کند که نشان‌دهنده اندازه و ترکیب آن مجموعه باشد.\n\
      \nدامنه کاربرد\n\n5 . واحد تجاری باید این استاندارد را برای تمام قراردادها با مشتریان، به استثنای موارد زیر، بکار گیرد:\n\
      \nالف. قراردادهای اجاره مشمول دامنه کاربرد استاندارد حسابداری 21 حسابداري‌ اجاره‌ها؛\n\nب. قراردادهای بیمه مشمول دامنه\
      \ کاربرد استاندارد حسابداری 28 فعالیتهای بیمه عمومی؛\n\nپ. ابزارهای مالی مشمول دامنه کاربرد استاندارد حسابداری 15 حسابداری\
      \ سرمایه‌گذاریها، استاندارد حسابداری 39 صورتهای مالی تلفیقی، استاندارد حسابداری 40 مشارکتها، استاندارد حسابداری 18 صورتهای\
      \ مالی جداگانه و استاندارد حسابداری 20 سرمایه‌گذاری در واحدهای تجاری وابسته و مشارکتهای خاص؛ و\n\nت. مبادله‌های غیرپولی\
      \ بین واحدهای تجاری دارای فعالیتهای تجاری همانند، برای تسهیل فروش به مشتریان یا مشتریان بالقوه. برای مثال، این استاندارد\
      \ در خصوص قرارداد بین دو شرکت نفتی که توافق می‌‌‌‌‌‌کنند برای پاسخگویی به موقع به تقاضای مشتریان خود در مکانهای تعیین‌شده\
      \ نفت را با یکدیگر مبادله کنند کاربرد ندارد.\n\n6 . واحد تجاری این استاندارد را باید در مورد قراردادی (به استثنای قراردادهای\
      \ اشاره‌شده در بند 5) بکار گیرد که طرف قرارداد مشتری است. مشتری شخصی است که در قبال پرداخت مابه‌ازا برای دستیابی به\
      \ کالاها یا خدماتی که خروجی فعالیتهای عادی واحد تجاری است، قرارداد با واحد تجاری منعقد کرده است. برای مثال، در صورتی‌\
      \ که طرف قرارداد، به جای انعقاد قرارداد برای دستیابی به خروجی فعالیتهای عادی واحد تجاری، قراردادی را به منظور مشارکت\
      \ در یک فعالیت یا فرایند منعقد کرده باشد که طرفین آن قرارداد در ریسکها و مزایای حاصل از آن فعالیت یا فرایند (نظیر ایجاد\
      \ یک دارایی از طریق توافق همکاری) سهیم باشند، طرف قرارداد مشتری محسوب نمی‌شود.\n\n7 . بخشی از قرارداد با مشتری ممکن\
      \ است در دامنه کاربرد این استاندارد و بخش دیگر آن، در دامنه کاربرد سایر استانداردهای اشاره‌شده در بند 5 قرار گیرد.\n\
      \nالف. اگر در سایر استانداردها چگونگی تفکیک و/ یا اندازه‌گیری اولیه یک یا چند بخش از قرارداد مشخص شده باشد، آنگاه واحد\
      \ تجاری باید ابتدا الزامات تفکیک و/ یا اندازه‌گیری مندرج در آن استانداردها را بکار گیرد. واحد تجاری باید مبلغ بخشی (یا\
      \ بخشهایی) از قرارداد را که در ابتدا طبق سایر استانداردها اندازه‌گیری شده است، از قیمت معامله جدا کند و برای تخصیص مبلغ\
      \ باقیمانده قیمت معامله (در صورت وجود) به هر تعهد عملکردی مشمول دامنه کاربرد این استاندارد و به سایر بخشهای قرارداد\
      \ طبق بند 7(ب)، بندهای 73 تا 86 را بکار گیرد.\n\nب. اگر در سایر استانداردها چگونگی تفکیک و یا/ اندازه‌گیری اولیه یک\
      \ یا چند بخش از قرارداد مشخص نشده باشد، آنگاه واحد تجاری باید این استاندارد را برای تفکیک و/ یا اندازه‌گیری اولیه آن\
      \ بخش (یا بخشهای) قرارداد با مشتری بکار گیرد.\n\n8 . چنانچه مخارج مختص دستیابی به قرارداد با مشتری و مخارج تحمل‌شده\
      \ برای ایفای قرارداد با مشتری در دامنه کاربرد استاندارد دیگری قرار نگیرد، این استاندارد نحوه حسابداری مخارج مذکور را\
      \ تعیین می‌کند (به بندهای 91 تا 104 مراجعه شود). واحد تجاری باید بندهای مذکور را تنها برای مخارج تحمل‌شده مرتبط با قرارداد\
      \ با مشتری (یا بخشی از آن قرارداد) که در دامنه کاربرد این استاندارد است، بکار گیرد.\n\nشناخت\n\nتشخیص قرارداد\n\n9 .\
      \ واحد تجاری باید قرارداد با یک مشتری، که در دامنه کاربرد این استاندارد است، را تنها هنگامی به حساب منظور کند که تمام\
      \ معیارهای زیر احراز شود:\n\nالف. طرفین، قرارداد را (به صورت کتبی، شفاهی یا طبق سایر رویه‌های مرسوم تجاری) تأیید کرده\
      \ باشند و نسبت به انجام تعهدات خود، متعهد باشند؛\n\nب. واحد تجاری بتواند حقوق هر یک از طرفین را در ارتباط با کالاها\
      \ یا خدماتی که باید انتقال یابد، تشخیص دهد؛\n\nپ. واحد تجاری بتواند شرایط پرداخت برای کالاها یا خدماتی که باید انتقال\
      \ یابد را تشخیص دهد؛\n\nت. قرارداد محتوای تجاری داشته باشد (یعنی انتظار رود ریسک، زمانبندی یا مبلغ جریانهای نقدی آتی\
      \ واحد تجاری، در نتیجه قرارداد تغییر کند)؛ و\n\nث. وصول مابه‌ازایی که واحد تجاری در قبال انتقال کالاها یا خدمات به مشتری\
      \ نسبت به آن محق است، محتمل باشد. واحد تجاری در ارزیابی اینکه وصول مبلغ مابه‌ازا محتمل است یا خیر، تنها باید توانایی\
      \ و قصد مشتری برای پرداخت مبلغ مابه‌ازای مذکور در سررسید را مورد توجه قرار دهد. اگر مبلغ مابه‌ازا به دلیل پیشنهاد مشوق\
      \ قیمت به مشتری متغیر باشد، مبلغ مابه‌ازایی که واحد تجاری نسبت به آن محق است، ممکن است از قیمت ذکرشده در قرارداد کمتر\
      \ باشد (به بند 52 مراجعه شود).\n\n10. قرارداد، توافقی بین دو یا چند شخص است که حقوق و تعهدات الزام‌آور ایجاد می‌کند.\
      \ الزام‌آور بودن حقوق و تعهدات در یک قرارداد، یک موضوع حقوقی است. قراردادها می‌توانند کتبی، شفاهی یا مبتنی ‌بر رویه‌های\
      \ مرسوم تجاری باشند. رویه‌ها و فرایندهای انعقاد قراردادها با مشتریان، بین حوزه‌های مقرراتی، صنایع و واحدهای تجاری متفاوت\
      \ است. افزون بر این، رویه‌ها و فرایندهای مزبور ممکن است در داخل یک واحد تجاری نیز متفاوت باشد (برای مثال، ممکن است به\
      \ طبقه مشتری یا ماهیت کالاها یا خدمات تعهدشده بستگی داشته باشد). واحد تجاری برای تعیین اینکه توافق با مشتری، حقوق و\
      \ تعهدات الزام‌آور ایجاد می‌کند یا خیر، و چه زمانی حقوق و تعهدات الزام‌آور ایجاد می‌کند، باید این رویه‌ها و فرایندها\
      \ را مدنظر قرار دهد.\n\n11. برخی قراردادها با مشتریان ممکن است مدت زمان معینی نداشته باشند و بتوان آنها را توسط هر یک\
      \ از طرفهای قرارداد، در هر زمانی خاتمه داد یا تعدیل کرد. سایر قراردادها ممکن است بر مبنای دوره‌ای که در قرارداد مشخص\
      \ شده است، بطور خودکار تمدید شوند. واحد تجاری باید این استاندارد را برای مدت قرارداد (یعنی دوره قراردادی) که در آن مدت،\
      \ طرفین قرارداد حقوق و تعهدات الزام‌آور فعلی دارند، بکار گیرد.\n\n12. برای مقاصد بکارگیری این استاندارد، اگر هر یک از\
      \ طرفین قرارداد، بدون جبران خسارت طرف (یا طرفهای) دیگر، از حق الزام‌آور یک‌جانبه برای خاتمه دادن به قراردادی که اجرا\
      \ نشده است برخوردار باشد، قراردادی وجود ندارد. قرارداد در صورتی اجرانشده محسوب می‌شود که هر دو معیار زیر احراز شده باشد:\n\
      \nالف. واحد تجاری هنوز کالاها یا خدمات تعهدشده را به مشتری انتقال نداده باشد؛ و\n\nب. واحد تجاری هنوز مابه‌ازایی در\
      \ قبال کالاها یا خدمات تعهدشده دریافت نکرده باشد و هنوز نسبت به دریافت آن محق نباشد.\n\n13. اگر قرارداد با مشتری معیارهای\
      \ مندرج در بند 9 را در آغاز قرارداد احراز کند، واحد تجاری نباید این معیارها را مجدداً ارزیابی کند، مگر اینکه نشانه‌ای\
      \ از تغییری عمده در واقعیتها و شرایط وجود داشته باشد. برای مثال، اگر توانایی مشتری برای پرداخت مابه‌ازا به میزان قابل\
      \ ملاحظه‌ای کاهش یافته باشد، واحد تجاری احتمال وصول مابه‌ازایی که در قبال انتقال مابقی کالاها یا خدمات به مشتری، نسبت\
      \ به آن محق می‌شود را مجدداً ارزیابی می‌کند.\n\n14. اگر قرارداد با مشتری معیارهای مندرج در بند 9 را احراز نکند، واحد\
      \ تجاری باید به ارزیابی قرارداد ادامه دهد تا تعیین نماید که آیا معیارهای مندرج در بند 9 متعاقباً احراز شده است یا خیر.\n\
      \n15. هنگامی که قرارداد با مشتری معیارهای مندرج در بند 9 را احراز نمی‌کند و واحد تجاری مابه‌ازایی را از مشتری دریافت\
      \ می‌کند، واحد تجاری تنها در صورتی باید مابه‌ازای دریافتی را به عنوان درآمد عملیاتی شناسایی کند که یکی از رویدادهای\
      \ زیر واقع شده باشد:\n\nالف. واحد تجاری تعهدات باقیمانده‌ای برای انتقال کالاها یا خدمات به مشتری نداشته باشد و تمام\
      \ یا تقریباً تمام مابه‌ازای تعهدشده توسط مشتری را دریافت کرده باشد و غیرقابل استرداد باشد؛ یا\n\nب. قرارداد خاتمه یافته\
      \ باشد و مابه‌ازای دریافتی از مشتری غیرقابل استرداد باشد.\n\n16. واحد تجاری باید مابه‌ازای دریافتی از مشتری را تا زمان\
      \ وقوع یکی از رویدادهای مندرج در بند 15 یا تا زمانی که معیارهای مندرج در بند 9 متعاقباً احراز شود (به بند 14 مراجعه\
      \ شود)، به عنوان بدهی شناسایی کند. این بدهی، با توجه به واقعیتها و شرایط مرتبط با قرارداد، یا بیانگر تعهد واحد تجاری\
      \ به انتقال کالاها یا خدمات در آینده است یا بیانگر تعهد واحد تجاری به استرداد مابه‌ازای دریافتی است. در هر دو حالت،\
      \ بدهی مذکور باید به مبلغ مابه‌ازای دریافتی از مشتری اندازه‌گیری شود.\n\nترکیب قراردادها\n\n17. واحد تجاری، در صورت\
      \ احراز یک یا چند معیار از معیارهای زیر، باید دو یا چند قرارداد را که هم‌زمان یا در زمانهای نزدیک به هم با یک مشتری\
      \ (یا اشخاص وابسته به آن مشتری) منعقد کرده است، ترکیب کند و آنها را به عنوان قراردادی واحد در نظر بگیرد:\n\nالف. قراردادها\
      \ به صورت یک بسته با یک هدف تجاری واحد، مذاکره شده باشند؛\n\nب. مبلغ مابه‌ازای قابل پرداخت در یک قرارداد به قیمت یا\
      \ عملکرد قرارداد دیگر بستگی داشته باشد؛ یا\n\nپ. کالاها یا خدمات تعهدشده در قراردادها (یا برخی کالاها یا خدمات تعهدشده\
      \ در هر یک از قراردادها)، طبق بندهای 22 تا 30 تعهد عملکردی واحدی باشند.\n\nتعدیل قرارداد\n\n18. تعدیل قرارداد، تغییر\
      \ در دامنه یا قیمت (یا هر دو) یک قرارداد است که به تایید طرفهای قرارداد رسیده است. در برخی صنایع و حوزه‌های مقرراتی،\
      \ تعدیل قرارداد ممکن است به عنوان دستور تغییر، اصلاحیه، متمم یا الحاقیه قرارداد شناخته شود. تعدیل قرارداد زمانی وجود\
      \ دارد که طرفهای قرارداد، تعدیلی را تأیید کنند که یا به ایجاد حقوق و تعهدات الزام‌آور جدید یا به تغییر حقوق و تعهدات\
      \ الزام‌آور موجود برای طرفهای قرارداد منجر ‌شود. تعدیل قرارداد می‌تواند به صورت کتبی، شفاهی یا بطور ضمنی طبق رویه‌های\
      \ مرسوم تجاری تأیید شود. اگر طرفهای قرارداد، تعدیل قرارداد را تأیید نکرده باشند، واحد تجاری باید بکارگیری این استاندارد\
      \ را برای قرارداد موجود، تا زمان تأیید تعدیل قرارداد ادامه دهد.\n\n19. حتی در صورتی‌که طرفهای قرارداد درباره دامنه تعدیل\
      \ یا قیمت تعدیل (یا هر دو)، اختلاف نظر داشته باشند، یا طرفهای قرارداد تغییر در دامنه قرارداد را تأیید کرده باشند اما\
      \ هنوز تغییر متناظر در قیمت را تعیین نکرده باشند، ممکن است تعدیل قرارداد وجود داشته باشد. برای تعیین اینکه حقوق و تعهدات\
      \ ایجادشده یا تغییریافته از طریق تعدیل، الزام‌آور است یا خیر، واحد تجاری باید تمام واقعیتها و شرایط مرتبط از جمله شرایط\
      \ قرارداد و شواهد دیگر را مدنظر قرار دهد. اگر طرفهای قرارداد، تغییر در دامنه قرارداد را تأیید کرده باشند، اما هنوز تغییر\
      \ متناظر در قیمت را تعیین نکرده باشند، واحد تجاری باید طبق بندهای 50 تا 54 در ارتباط با برآورد مابه‌ازای متغیر و بندهای\
      \ 56 تا 58 در ارتباط با محدودکردن برآوردهای مابه‌ازای متغیر، تغییر در قیمت معامله که از تعدیل ناشی می‌شود را برآورد\
      \ کند.\n\n20 . واحد تجاری باید تعدیل قرارداد را در صورت وجود هر دو شرط زیر، به عنوان قراردادی جداگانه در نظر بگیرد:\n\
      \nالف. دامنه قرارداد به دلیل اضافه کردن کالاها یا خدمات تعهدشده‌ای که طبق بندهای 26 تا 30 متمایز هستند، افزایش یابد؛\
      \ و\n\nب. قیمت قرارداد، به مبلغ مابه‌ازایی که نشان‌دهنده قیمت فروش مستقل کالاها یا خدمات تعهدشده اضافی و هرگونه تعدیل\
      \ مقتضی در آن قیمت جهت انعکاس شرایط آن قرارداد خاص است، افزایش یابد. برای مثال، واحد تجاری ممکن است قیمت فروش مستقل\
      \ یک کالا یا خدمت اضافی را بابت تخفیفی که مشتری دریافت می‌کند تعدیل کند، زیرا ضرورتی ندارد واحد تجاری مخارج فروشی را\
      \ تحمل کند که در صورت فروش کالا یا خدمت مشابه به یک مشتری جدید، متحمل می‌شد.\n\n21. اگر طبق بند 20، تعدیل قرارداد به\
      \ عنوان قرارداد جداگانه در نظر گرفته نشود، واحد تجاری باید کالاها یا خدمات تعهدشده‌ای که در تاریخ تعدیل قرارداد هنوز\
      \ انتقال نیافته‌ است (یعنی کالاها یا خدمات تعهدشده باقیمانده) را به یکی از شیوه‌های زیر، هر کدام که کاربرد داشته باشد،\
      \ به حساب منظور کند:\n\nالف. اگر کالاها یا خدمات باقیمانده، متمایز از کالاها یا خدمات انتقال‌یافته در تاریخ تعدیل قرارداد\
      \ یا قبل از آن باشد، واحد تجاری باید تعدیل قرارداد را به‌گونه‌ای به حساب منظور کند که گویی قرارداد موجود خاتمه یافته\
      \ و یک قرارداد جدید منعقد شده است. مبلغ مابه‌ازایی که باید به تعهدات عملکردی باقیمانده (یا کالاها یا خدمات متمایز باقیمانده\
      \ در یک تعهد عملکردی منفرد مشخص‌شده طبق بند 22(ب)) تخصیص یابد، مجموع موارد زیر است:\n\n1 . مابه‌ازای تعهدشده توسط مشتری\
      \ (شامل مبالغی که قبلاً از مشتری دریافت شده است) که در برآورد قیمت معامله منظور شده و به عنوان درآمد عملیاتی شناسایی\
      \ نشده است؛ و\n\n2 . مابه‌ازای تعهدشده به عنوان بخشی از تعدیل قرارداد.\n\nب. اگر کالاها یا خدمات باقیمانده، متمایز نباشند\
      \ و، در نتیجه بخشی از تعهد عملکردی منفردی را تشکیل دهند که قسمتی از آن تا تاریخ تعدیل قرارداد ایفا شده است، واحد تجاری\
      \ باید تعدیل قرارداد را به‌گونه‌ای به حساب منظور کند که گویی بخشی از قرارداد موجود است. اثر تعدیل قرارداد بر قیمت معامله\
      \ و اندازه‌گیری پیشرفت واحد تجاری در ایفای کامل تعهد عملکردی، در تاریخ تعدیل قرارداد به عنوان تعدیل درآمد عملیاتی (افزایش\
      \ یا کاهش درآمد عملیاتی) شناسایی می‌شود (یعنی تعدیل درآمد عملیاتی بر مبنای آثار انباشته تغییرات).\n\nپ. اگر کالاها یا\
      \ خدمات باقیمانده ترکیبی از موارد (الف) و (ب) باشد، واحد تجاری باید آثار تعدیل بر تعهدات عملکردی ایفانشده (شامل تعهداتی\
      \ که بخشی از آن ایفا نشده است) در قرارداد تعدیل‌شده را به شیوه‌ای به حساب منظور کند که با اهداف این بند سازگار باشد.\n\
      \nتشخیص تعهدات عملکردی\n\n22 . در آغاز قرارداد، واحد تجاری باید کالاها یا خدمات تعهدشده در قرارداد با مشتری را ارزیابی\
      \ کند و هرگونه تعهد برای انتقال موارد زیر به مشتری را به عنوان یک تعهد عملکردی تشخیص دهد:\n\nالف. یک کالا یا خدمت (یا\
      \ بسته‌ای از کالاها یا خدمات) که متمایز است؛ یا\n\nب. یک مجموعه از کالاها یا خدمات متمایز که تا حد زیادی یکسان هستند\
      \ و الگوی انتقال آنها به مشتری یکسان است (به بند 23 مراجعه شود).\n\n23 . الگوی انتقال یک مجموعه از کالاها یا خدمات متمایز،\
      \ در صورت احراز هر دو معیار زیر یکسان خواهد بود:\n\nالف. هر کالا یا خدمت متمایز در مجموعه‌ای که واحد تجاری متعهد به\
      \ انتقال آن به مشتری است، معیارهای مندرج در بند 35 را برای در نظر گرفتن به عنوان تعهد عملکردی ایفاشده در طول زمان، احراز\
      \ کند؛ و\n\nب. طبق بندهای 39 تا 40، به منظور اندازه‌گیری پیشرفت واحد تجاری در ایفای کامل تعهد عملکردی برای انتقال هر\
      \ کالا یا خدمت متمایز در آن مجموعه به مشتری، از شیوه یکسانی استفاده شود.\n\nتعهدات در قرارداد با مشتریان\n\n24 . در\
      \ قرارداد با مشتری، عموماً کالاها یا خدماتی که واحد تجاری متعهد به انتقال آنها به مشتری است، به صراحت مشخص می‌شود. با\
      \ وجود این، تعهدات عملکردی مشخص‌شده در قرارداد با مشتری ممکن است محدود به کالاها یا خدماتی نباشد که به صراحت در قرارداد\
      \ ذکر شده است. دلیل این موضوع آن است که قرارداد با مشتری ممکن است شامل تعهداتی باشد که بطور ضمنی از طریق رویه‌های مرسوم\
      \ تجاری، سیاستها یا بیانیه‌های خاص منتشرشده واحد تجاری بیان شده است، مشروط بر اینکه، در زمان انعقاد قرارداد، تعهدات\
      \ مذکور توقع به‌جایی در مشتری ایجاد کند که واحد تجاری آن کالا یا خدمات را به مشتری منتقل خواهد کرد.\n\n25 . در تعهدات\
      \ عملکردی، فعالیتهایی که واحد تجاری باید برای ایفای قرارداد تقبل کند، درج نمی‌شود مگر اینکه فعالیتهای مذکور کالا یا\
      \ خدمتی را به مشتری انتقال دهند. برای مثال، ممکن است لازم باشد ارائه‌دهندگان خدمات، امور اداری گوناگونی را برای تنظیم\
      \ قرارداد انجام دهند. اجرای این امور هیچ خدمتی را همزمان با اجرای آن، به مشتری منتقل نمی‌کند. بنابراین، این فعالیتهای\
      \ تنظیم قرارداد، تعهد عملکردی محسوب نمی‌شود.\n\nکالاها یا خدمات متمایز\n\n26 . کالاها یا خدمات تعهدشده، بسته به قرارداد\
      \ ممکن است شامل موارد زیر باشد، اما محدود به این موارد نیست:\n\nالف. فروش محصولات تولیدشده توسط یک واحد تجاری (برای\
      \ مثال، موجودی محصولات یک واحد تولیدی)؛\n\nب. فروش کالاهای خریداری‌شده توسط واحد تجاری (برای مثال، موجودی کالای یک واحد\
      \ بازرگانی)؛\n\nپ. فروش حق نسبت به کالاها یا خدمات خریداری‌شده توسط یک واحد تجاری (برای مثال، فروش بلیط توسط یک واحد\
      \ تجاری که به عنوان اصیل، طبق توصیف بندهای ب34 تا ب42، عمل می‌کند)؛\n\nت. انجام وظیفه (یا وظایفی) برای مشتری، که بطور\
      \ قراردادی در مورد آن توافق شده است؛\n\nث. ارائه خدمت آمادگی ‌برای فراهم کردن کالاها یا خدمات (برای مثال، به‌روزآوری\
      \ از پیش‌ تعیین‌نشده نرم‌‌افزار که بر مبنای ”در صورت در دسترس بودن“ عرضه می‌شود) یا ارائه خدمت فراهم کردن کالاها یا\
      \ خدمات در دسترس برای مشتری جهت استفاده به محض اینکه مشتری تصمیم بگیرد؛\n\nج. ارائه خدمت فراهم کردن بستر انتقال کالاها\
      \ یا خدمات به مشتری برای شخصی دیگر (برای مثال، عمل به عنوان نماینده شخصی دیگر، طبق توصیف بندهای ب34 تا ب42)؛\n\nچ. اعطای\
      \ حق نسبت به کالاها یا خدماتی که قرار است در آینده ارائه شود، به‌گونه‌ای که مشتری بتواند آن را مجدداً برای مشتریان خود\
      \ فراهم کند یا به آنها بفروشد (برای مثال، یک واحد تجاری که محصول خود را به یک واحد بازرگانی می‌فروشد، متعهد می‌شود کالا\
      \ یا خدمتی اضافی را به فردی که آن محصول را از واحد بازرگانی خریداری می‌کند، انتقال دهد)؛\n\nح. ساخت، تولید یا ایجاد\
      \ یک دارایی از جانب یک مشتری؛\n\nخ. اعطای مجوز (به بندهای ب56 تا ب69 مراجعه شود)؛ و\n\nد. اعطای اختیار خرید کالاها یا\
      \ خدمات اضافی (در صورتی که اختیارهای مذکور حق بااهمیتی برای مشتری ایجاد کند، طبق توصیف بندهای ب43 تا ب47).\n\n27 . کالا\
      \ یا خدمت تعهدشده به مشتری، در صورت احراز هر دو معیار زیر متمایز محسوب می‌شود:\n\nالف. مشتری بتواند از آن کالا یا خدمت،\
      \ به تنهایی یا همراه با سایر منابعی که به سهولت در دسترس است، منتفع شود (یعنی کالا یا خدمت قابلیت متمایز بودن را دارد)؛\
      \ و\n\nب. تعهد واحد تجاری برای انتقال آن کالا یا خدمت به مشتری، از سایر تعهدات مندرج در قرارداد بطور جداگانه قابل تشخیص\
      \ باشد (یعنی تعهد برای انتقال کالا یا خدمت، در متن قرارداد متمایز شده باشد).\n\n28 . یک مشتری در صورتی می‌تواند طبق\
      \ بند 27(الف) از یک کالا یا خدمت منتفع شود که آن کالا یا خدمت را بتواند استفاده کند، مصرف کند، در ازای مبلغی بیشتر از\
      \ ارزش اسقاط، آن را به فروش برساند یا به شیوه‌ای نگهداری کند که منافع اقتصادی آتی ایجاد نماید. در مورد برخی کالاها یا\
      \ خدمات، مشتری ممکن است بتواند از کالا یا خدمت، به تنهایی منتفع شود. در مورد برخی دیگر از کالاها یا خدمات، مشتری ممکن\
      \ است بتواند از کالا یا خدمت تنها در ترکیب با منابع دیگری که به سهولت در دسترس است، منتفع شود. منبع به سهولت در دسترس،\
      \ کالا یا خدمتی است که بطور جداگانه به فروش می‌رسد (توسط واحد تجاری یا واحد تجاری دیگر) یا منبعی است که مشتری قبلاً\
      \ آن را از واحد تجاری (شامل کالاها یا خدماتی که واحد تجاری طبق قرارداد، قبلاً به مشتری منتقل کرده است) یا از سایر معاملات\
      \ یا رویدادها به دست آورده است. عوامل گوناگون ممکن است شواهدی فراهم کند که نشان می‌دهد مشتری می‌تواند از کالا یا خدمت،\
      \ به تنهایی یا در ترکیب با سایر منابع به سهولت در دسترس منتفع شود. برای مثال، این موضوع که واحد تجاری یک کالا یا خدمت\
      \ را معمولاً بطور جداگانه می‌فروشد، نشان می‌دهد که مشتری می‌تواند از آن کالا یا خدمت، به تنهایی یا در ترکیب با سایر\
      \ منابع به سهولت در دسترس، منتفع شود.\n\n29 . هدف از ارزیابی اینکه تعهد واحد تجاری برای انتقال کالاها یا خدمات به مشتری،\
      \ طبق بند 27(ب) بطور جداگانه قابل تشخیص است یا خیر، این است که مشخص شود ماهیت تعهد در متن قرارداد، انتقال هر یک از آن\
      \ کالاها یا خدمات بطور جداگانه است یا انتقال یک قلم ترکیبی یا اقلامی است که کالاها یا خدمات مزبور، ورودی آنها می‌باشد.\
      \ عواملی که نشان می‌دهد دو یا چند تعهد واحد تجاری برای انتقال کالاها یا خدمات به مشتری، بطور جداگانه قابل تشخیص نیست\
      \ شامل موارد زیر است، اما محدود به این موارد نیست:\n\nالف. واحد تجاری خدمت قابل ملاحظه‌ای برای یکپارچه‌سازی آن کالاها\
      \ یا خدمات تعهدشده در قرارداد با سایر کالاها یا خدمات تعهدشده در قرارداد ارائه می‌کند تا به بسته‌ای از کالاها یا خدماتی\
      \ دست یابد که نشان‌دهنده یک خروجی ترکیبی یا چندین خروجی است که مشتری برای دستیابی به آن خروجیها، قرارداد را منعقد کرده\
      \ است. به عبارت دیگر، واحد تجاری از آن کالاها یا خدمات به عنوان ورودی استفاده می‌کند تا یک خروجی ترکیبی یا چندین خروجی\
      \ مشخص‌شده توسط مشتری را تولید کند یا تحویل دهد. یک خروجی ترکیبی یا چندین خروجی ممکن است شامل بیش از یک مرحله، عنصر\
      \ یا واحد باشد.\n\nب. یک یا چند کالا یا خدمت تعهدشده در قرارداد، بطور قابل ملاحظه‌ای یک یا چند کالا یا خدمت دیگر تعهدشده\
      \ در قرارداد را تعدیل یا سفارشی‌سازی کند، یا بطور قابل ملاحظه‌ای توسط یک یا چند کالا یا خدمت دیگر تعهدشده در قرارداد\
      \ تعدیل یا سفارشی‌سازی شود.\n\nپ. کالاها یا خدمات، وابستگی یا ارتباط بسیار زیادی با یکدیگر داشته باشند. به عبارت دیگر،\
      \ هر یک از کالاها یا خدمات، بطور قابل ملاحظه‌ای تحت تأثیر یک یا چند کالا یا خدمت دیگر مندرج در قرارداد قرار گیرد. برای\
      \ مثال، در برخی موارد، دو یا چند کالا یا خدمت به این دلیل بطور قابل ملاحظه‌ای تحت تأثیر یکدیگر قرار می‌گیرند که واحد\
      \ تجاری نمی‌تواند از طریق انتقال هر کدام از آن کالاها یا خدمات بطور مستقل از دیگری، تعهد خود را ایفا کند.\n\n30 . اگر\
      \ کالا یا خدمت تعهدشده متمایز نباشد، واحد تجاری باید آن کالا یا خدمت را تا جایی با سایر کالاها یا خدمات تعهدشده ترکیب\
      \ کند که بسته‌ای از کالاها یا خدمات متمایز را تشخیص دهد. در برخی موارد، این امر موجب می‌شود تمام کالاها یا خدمات تعهدشده\
      \ در قرارداد، به عنوان یک تعهد عملکردی منفرد در نظر گرفته شوند.\n\nایفای تعهدات عملکردی\n\n31 . واحد تجاری باید زمانی\
      \ (یا در طول زمانی) درآمد عملیاتی را شناسایی کند که یک تعهد عملکردی را از طریق انتقال کالا یا خدمت تعهدشده (یعنی یک\
      \ دارایی) به مشتری ایفا نماید. یک دارایی زمانی (یا در طول زمانی) انتقال‌ می‌یابد که مشتری کنترل آن دارایی را به دست\
      \ می‌آورد.\n\n32 . برای هر تعهد عملکردی مشخص‌‌شده طبق بندهای 22 تا 30، واحد تجاری باید در آغاز قرارداد تعیین کند که\
      \ آیا تعهد عملکردی را در طول زمان (طبق بندهای 35 تا 37) یا در نقطه‌ای از زمان (طبق بند 38) ایفا می‌کند. اگر واحد تجاری\
      \ تعهد عملکردی را در طول زمان ایفا نکند، تعهد عملکردی در نقطه‌ای از زمان ایفا شده است.\n\n33 . کالاها و خدمات، در زمان\
      \ دریافت و استفاده، حتی اگر برای لحظاتی باشد، دارایی هستند (همانطور که در مورد بسیاری از خدمات اینگونه است). کنترل یک\
      \ دارایی به توانایی هدایت استفاده از دارایی و کسب تقریباً تمام منافع باقیمانده دارایی اشاره دارد. کنترل شامل توانایی\
      \ منع سایر اشخاص از هدایت استفاده از دارایی و کسب منافع حاصل از دارایی است. منافع یک دارایی، جریانهای نقدی (جریانهای\
      \ نقدی ورودی یا جلوگیری از خروج جریانهای نقدی) بالقوه‌ای است که بطور مستقیم یا غیرمستقیم، به شیوه‌های متعدد از جمله\
      \ موارد زیر می‌تواند به دست آِید:\n\nالف. استفاده از دارایی برای تولید کالاها یا ارائه خدمات (شامل خدمات عمومی)؛\n\n\
      ب. استفاده از دارایی برای افزایش ارزش سایر داراییها؛\n\nپ. استفاده از دارایی برای تسویه بدهیها یا کاهش هزینه‌ها؛\n\n\
      ت. فروش یا معاوضه دارایی؛\n\nث. وثیقه گذاشتن دارایی برای تضمین یک وام؛ و\n\nج. نگهداری دارایی.\n\n34 . واحد تجاری، هنگام\
      \ ارزیابی اینکه یک مشتری کنترل یک دارایی را به دست آورده است یا خیر، باید هرگونه توافق بازخرید دارایی را مدنظر قرار\
      \ دهد (به بندهای ب70 تا ب82 مراجعه شود).\n\nتعهدات عملکردی ایفاشده در طول زمان\n\n35 . واحد تجاری، در صورت احراز هر\
      \ یک از معیارهای زیر، کنترل کالا یا خدمت را در طول زمان منتقل می‌کند و بنابراین، در طول زمان تعهد عملکردی را ایفا و\
      \ درآمد عملیاتی را شناسایی می‌نماید:\n\nالف. مشتری، در طول زمان ایفای تعهد عملکردی توسط واحد تجاری، منافع ایجادشده از\
      \ عملکرد واحد تجاری را همزمان دریافت و مصرف کند (به بندهای ب3 تا ب4 مراجعه شود)؛\n\nب. عملکرد واحد تجاری، دارایی (برای\
      \ مثال، کار در جریان پیشرفت) را ایجاد کند یا توسعه دهد که مشتری در طول زمان ایجاد یا توسعه دارایی، آن را کنترل کند (به\
      \ بند ب5 مراجعه شود)؛یا\n\nپ. عملکرد واحد تجاری، دارایی با کاربرد جایگزین برای واحد تجاری ایجاد نکند (به بند 36 مراجعه\
      \ شود) و واحد تجاری نسبت به پرداخت مشتری بابت عملکرد تکمیل‌شده تا آن تاریخ، حق الزام‌آور داشته باشد (به بند 37 مراجعه\
      \ شود).\n\n36 . دارایی ایجادشده از طریق عملکرد واحد تجاری، در صورتی برای واحد تجاری کاربرد جایگزین ندارد که واحد تجاری،\
      \ در طول زمان ایجاد یا توسعه دارایی، با قیود قراردادی برای هدایت دارایی به منظور استفاده‌ای دیگر مواجه باشد یا برای\
      \ هدایت دارایی در وضعیت تکمیل‌شده جهت استفاده‌‌ای دیگر محدودیت عملی داشته باشد. ارزیابی اینکه دارایی برای واحد تجاری\
      \ کاربرد جایگزین دارد یا خیر، در آغاز قرارداد صورت می‌‌گیرد. پس از آغاز قرارداد، واحد تجاری نباید ارزیابی کاربرد جایگزین\
      \ دارایی را به‌روزآوری کند، مگر اینکه طرفهای قرارداد، تعدیلی در قرارداد را تأیید کنند که به موجب آن، تعهد عملکردی اساساً\
      \ تغییر کند. در بندهای ب6 تا ب8، رهنمودهای ارزیابی اینکه دارایی برای واحد تجاری کاربرد جایگزین دارد یا خیر، ارائه شده\
      \ است.\n\n37 . واحد تجاری هنگام ارزیابی اینکه طبق بند 35(پ) نسبت به پرداخت مشتری بابت عملکرد تکمیل‌شده تا آن تاریخ،\
      \ حق الزام‌آور دارد یا خیر، باید شرایط قرارداد و نیز قوانین مرتبط با قرارداد را مدنظر قرار دهد. ضرورتی ندارد که حق نسبت\
      \ به پرداخت مشتری بابت عملکرد تکمیل‌شده تا آن تاریخ، مبلغی ثابت باشد. با وجود این، اگر قرارداد به دلایلی غیر از عدم\
      \ ایفای تعهد توسط واحد تجاری، به وسیله مشتری یا شخص دیگری خاتمه یابد، واحد تجاری باید در تمام طول مدت قرارداد، نسبت\
      \ به مبلغی محق باشد که حداقل، عملکرد تکمیل‌شده توسط واحد تجاری تا آن تاریخ را جبران کند. در بندهای ب9 تا ب13، در مورد\
      \ ارزیابی وجود و الزام‌آور بودن حق نسبت به پرداخت مشتری و اینکه حق واحد تجاری نسبت به پرداخت مشتری، واحد تجاری را به\
      \ پرداخت مشتری بابت عملکرد تکمیل‌شده تا آن تاریخ محق می‌کند یا خیر، رهنمود ارائه شده است.\n\nتعهدات عملکردی ایفاشده\
      \ در نقطه‌ای از زمان\n\n38 . اگر واحد تجاری تعهد عملکردی را طبق بندهای 35 تا 37 در طول زمان ایفا نکند، تعهد عملکردی\
      \ در نقطه‌ای از زمان ایفا شده است. برای تعیین نقطه‌ای از زمان که در آن، مشتری کنترل دارایی تعهدشده را به دست می‌آورد\
      \ و واحد تجاری تعهد عملکردی را ایفا می‌کند، واحد تجاری باید الزامات کنترل طبق بندهای 31 تا 34 را مد نظر قرار دهد. افزون\
      \ بر این، واحد تجاری باید نشانه‌های انتقال کنترل، که شامل موارد زیر است، اما محدود به آنها نیست، را در نظر بگیرد:\n\n\
      الف. واحد تجاری حق فعلی نسبت به پرداخت مشتری بابت دارایی داشته باشد- چنانچه مشتری در حال حاضر متعهد به پرداخت بابت دارایی\
      \ باشد، این موضوع ممکن است نشان دهد که مشتری توانایی هدایت استفاده از دارایی مورد مبادله را کسب کرده و تقریباً تمام\
      \ منافع باقیمانده حاصل از آن دارایی را به دست آورده است.\n\nب. مشتری مالکیت قانونی دارایی را داشته باشد- مالکیت قانونی\
      \ ممکن است نشان ‌دهد که کدام یک از طرفهای قرارداد توانایی هدایت استفاده از دارایی را دارد و تقریباً تمام منافع باقیمانده\
      \ حاصل از دارایی را به دست می‌آورد، یا می‌تواند دسترسی واحدهای تجاری دیگر به منافع مذکور را محدود کند. بنابراین، انتقال\
      \ مالکیت قانونی یک دارایی ممکن است نشان دهد که مشتری کنترل دارایی را به دست آورده است. اگر واحد تجاری مالکیت قانونی\
      \ را صرفاً به منظور محافظت در برابر عدم پرداختهای مشتری حفظ کند، این حق واحد تجاری مانع به دست آوردن کنترل دارایی توسط\
      \ مشتری نمی‌شود.\n\nپ. واحد تجاری تصرف فیزیکی دارایی را منتقل کرده باشد- تصرف فیزیکی دارایی ممکن است نشان دهد مشتری\
      \ توانایی هدایت استفاده از دارایی را دارد و تقریباً تمام منافع باقیمانده دارایی را به دست می‌آورد، یا می‌تواند دسترسی\
      \ واحدهای تجاری دیگر به منافع مذکور را محدود کند. با وجود این، تصرف فیزیکی و کنترل دارایی، ممکن است همزمان با یکدیگر\
      \ وجود نداشته باشند. برای مثال، در برخی توافقهای بازخرید و در برخی قراردادهای حق‌العملکاری، مشتری یا حق‌العمل‌کار ممکن\
      \ است تصرف فیزیکی دارایی تحت کنترل واحد تجاری را داشته باشد. در مقابل، در برخی توافقهای فروش و نگهداری، واحد تجاری ممکن\
      \ است تصرف فیزیکی دارایی تحت کنترل مشتری را داشته باشد. در بندهای ب70 تا ب82، ب83 تا ب84 و ب85 تا ب88، به ترتیب رهنمودهایی\
      \ درباره حسابداری توافقهای بازخرید، توافقهای حق‌العملکاری و توافقهای فروش و نگهداری ارائه شده است.\n\nت. مشتری ریسکها\
      \ و مزایای عمده مالکیت دارایی را داشته باشد- انتقال ریسکها و مزایای عمده مالکیت یک دارایی به مشتری ممکن است نشان دهد\
      \ آن مشتری، توانایی هدایت استفاده از دارایی و تقریباً تمام منافع باقیمانده حاصل از دارایی را به دست آورده است. با وجود\
      \ این، هنگام ارزیابی ریسکها و مزایای مالکیت دارایی تعهدشده، واحد تجاری باید ریسکی که منجر به ایجاد تعهد عملکردی جداگانه،\
      \ مازاد بر تعهد عملکردی انتقال دارایی می‌شود را مستثنی کند. برای مثال، واحد تجاری ممکن است کنترل دارایی را به مشتری\
      \ انتقال داده باشد، اما هنوز تعهد عملکردی اضافی برای ارائه خدمات حفاظت و نگهداری مرتبط با دارایی انتقال‌یافته را ایفا\
      \ نکرده باشد.\n\nث. مشتری دارایی را پذیرفته باشد- پذیرش دارایی توسط مشتری ممکن است بیانگر آن باشد که مشتری توانایی هدایت\
      \ استفاده از دارایی و تقریباً تمام منافع باقیمانده حاصل از دارایی را به دست آورده است. برای ارزیابی تأثیر شرطهای قراردادی\
      \ پذیرش توسط مشتری بر زمان انتقال کنترل دارایی، واحد تجاری باید رهنمود مندرج در بندهای ب89 تا ب92 را مورد توجه قرار\
      \ دهد.\n\nاندازه‌گیری پیشرفت در ایفای کامل تعهد عملکردی\n\n39 . برای هر تعهد عملکردی که طبق بندهای 35 تا 37 در طول زمان\
      \ ایفا می‌شود، واحد تجاری باید درآمد عملیاتی را در طول زمان از طریق اندازه‌گیری پیشرفت در ایفای کامل تعهد عملکردی مذکور\
      \ شناسایی کند. هنگام اندازه‌گیری پیشرفت، هدف این است که عملکرد واحد تجاری در انتقال کنترل کالاها یا خدمات تعهدشده به\
      \ مشتری (یعنی ایفای تعهد عملکردی واحد تجاری) نشان داده شود.\n\n40 . واحد تجاری باید از یک روش واحد برای اندازه‌گیری\
      \ پیشرفت هر تعهد عملکردی ایفاشده در طول زمان استفاده کند و باید آن روش را بطور یکنواخت برای تعهدات عملکردی مشابه و در\
      \ شرایط مشابه بکار گیرد. در پایان هر دوره گزارشگری، واحد تجاری باید پیشرفت در ایفای کامل تعهد عملکردی ایفاشده در طول\
      \ زمان را تجدید اندازه‌گیری کند.\n\nروشهای اندازه‌گیری پیشرفت\n\n41 . روشهای مناسب اندازه‌گیری پیشرفت، شامل روشهای مبتنی\
      \ بر خروجی و روشهای مبتنی بر ورودی است. برای بکارگیری روشهای مبتنی بر خروجی و روشهای مبتنی بر ورودی توسط واحد تجاری\
      \ به منظور اندازه‌گیری پیشرفت در ایفای کامل تعهدات عملکردی، در بندهای ب14 تا ب19 رهنمود ارائه می‌شود. واحد تجاری، در\
      \ تعیین روش مناسب برای اندازه‌گیری پیشرفت، باید ماهیت کالا یا خدمتی که متعهد است به مشتری منتقل کند را مدنظر قرار دهد.\n\
      \n42 . واحد تجاری هنگام بکارگیری یک روش برای اندازه‌گیری پیشرفت باید هرگونه کالا یا خدمتی که کنترل آن را به مشتری منتقل\
      \ نمی‌کند، از اندازه‌گیری پیشرفت مستثنی نماید. در مقابل، واحد تجاری باید هرگونه کالا یا خدمتی که کنترل آن را با ایفای\
      \ تعهد عملکردی به مشتری منتقل می‌کند، در اندازه‌گیری پیشرفت در نظر بگیرد.\n\n43 . واحد تجاری باید با تغییر شرایط در\
      \ طول زمان، اندازه‌گیری پیشرفت را به‌روزآوری کند تا هرگونه تغییر در نتیجه تعهد عملکردی را منعکس نماید. چنین تغییراتی\
      \ در اندازه‌گیری پیشرفت واحد تجاری، باید طبق استاندارد حسابداری 34 رویه‌های حسابداری، تغییر در برآوردهای حسابداری و\
      \ اشتباهات، به عنوان تغییر در برآورد حسابداری در نظر گرفته شود.\n\nاندازه‌گیری معقول پیشرفت\n\n44 . واحد تجاری تنها\
      \ در صورتی که بتواند بطور معقول پیشرفت در ایفای کامل تعهد عملکردی را اندازه‌گیری کند، بای\n\n</details>"
