      \ مقرراتی، صنایع و واحده\n- **بند 11:** برخی قراردادها با مشتریان ممکن است مدت زمان معینی نداشته باشند و بتوان آنها\
      \ را توسط هر یک از طرفهای قرارداد، در هر زمانی خاتمه داد یا تعدیل کرد. سایر قراردادها ممکن است بر مبنای دوره‌ای که در\
