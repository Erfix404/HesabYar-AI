      \ periods. Resolve the reporting period before applying this Skill. See `docs/CURRENT_RULES_1405.md`.\n\n# استاندارد\
      \ حسابداری 43: فهرست‌ مندرجات\n\n## بندهای کلیدی\n\n- **بند 1:** هدف این استاندارد تعیین اصولی است که واحد تجاری برای\
