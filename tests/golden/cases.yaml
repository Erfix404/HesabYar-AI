- id: validate_rule_bs001_fail
  tool: validate_rule
  args:
    rule_id: BS001
    statements:
      balance_sheet:
        total_assets: 10
        total_liabilities: 6
        total_equity: 5
  expect:
    rule_id: BS001
    outcome: fail
    severity: error
    message: 'ترازنامه تراز نیست (اختلاف: -1)'
    actual: '-1'
    explanation: 'فرمول: total_assets - (total_liabilities + total_equity) = -1 — باید برابر 0 (با تحمل 0.01) باشد. مقدار
      به‌دست‌آمده -1 است. مرجع: استاندارد 1.55'
    refs:
    - '1.55'
- id: validate_rule_bs001_pass
  tool: validate_rule
