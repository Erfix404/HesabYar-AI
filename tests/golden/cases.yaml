      \ را باید در مورد قراردادی (به استثنای قراردادهای اشاره‌شده در بند 5) بکار گیرد که طرف قرارداد مشتری است. مشتری شخصی\
      \ است که در قبال پرداخت مابه‌ازا برای دستیابی به کالاها یا خدماتی که خروجی فعالیتهای عادی واحد تجاری است، قرارداد با\
      \ واحد تجاری منعقد کرده است. برای مثال، در صورت\n- **بند 7:** بخشی از قرارداد با مشتری ممکن است در دامنه کاربرد این\
