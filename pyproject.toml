[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hesabyar"
version = "0.1.0"
description = "Deterministic Iranian accounting ledger and tax compliance engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "jdatetime>=5.0.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.18",
    "pyyaml>=6.0.0",
]

[project.scripts]
hesabyar = "hesabyar.cli:main"
hesabyar-mcp = "hesabyar.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "pyright>=1.1.350",
    "mcp>=1.2.0,<2",
    "anyio>=4.0.0",
]
mcp = [
    "mcp>=1.2.0,<2",
    "anyio>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "pyright>=1.1.350",
    "mcp>=1.2.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hesabyar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:jdatetime.*",
    "ignore::sqlalchemy.exc.SAWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "scripts",
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = ["scripts", "**/__pycache__", ".venv"]
extraPaths = ["src", "scripts"]
