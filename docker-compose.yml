services:
  postgres:
    image: postgres:16-alpine
    container_name: hesabyar-postgres
    environment:
      POSTGRES_USER: hesabyar
      POSTGRES_PASSWORD: hesabyar_pass
      POSTGRES_DB: hesabyar_test
    ports:
      - "15445:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hesabyar -d hesabyar_test"]
      interval: 10s
      timeout: 5s
      retries: 5
